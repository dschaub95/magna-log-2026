# W&B hyperparameter sweep on Torus; fixed params override src/magna/config.py defaults.
#   uv run sweep --sweep-cfg=configs/sweeps/torus.yaml

command:
  - uv
  - run
  - train

method: random

metric:
  name: environment/error_eval
  goal: minimize

parameters:
  project:
    value: magna

  data.path:
    value: data/pattern_formation/Torus/target_coord.pt

  env.size:
    value: auto
  env.auto_size_buffer:
    value: 150.0
  env.perception_radius:
    value: 150.0
  env.max_speed:
    value: 4.0
  env.time_horizon:
    value: 2048
  env.density_grad_obs:
    value: false
  env.reward_min_distance:
    value: 0.0

  train.total_timesteps:
    value: 800_000_000
  train.bptt_horizon:
    value: 96
  train.print_config:
    value: false
  train.print_dashboard:
    value: false
  train.generate_rollout_video:
    value: false

  env.lam_nbr_reward:
    distribution: uniform
    min: 0.4
    max: 0.8
  env.reward_interval_multiplier:
    distribution: uniform
    min: 1.5
    max: 2.5
  env.boundary_penalty:
    distribution: uniform
    min: -0.5
    max: 0.0
  env.reward_scaler:
    distribution: uniform
    min: 0.5
    max: 1.5

  train.learning_rate:
    distribution: uniform
    min: 0.015
    max: 0.025
  train.ent_coef:
    distribution: uniform
    min: 0.01
    max: 0.06
  train.max_grad_norm:
    distribution: uniform
    min: 1.0
    max: 2.0
  train.vf_coef:
    distribution: uniform
    min: 1.0
    max: 3.0

  model.action_stay_bias:
    distribution: uniform
    min: 0.0
    max: 0.25
