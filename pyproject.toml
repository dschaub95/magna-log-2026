[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "magna"
version = "0.1.0"
description = "Learning Graph Neural Cellular Automata via Multi-Agent Reinforcement Learning"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Darius P. Schaub", email = "schaub.darius@gmail.com" },
]
authors = [
  { name = "Darius P. Schaub", email = "schaub.darius@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "gpytorch>=1.15.1",
  "imageio[ffmpeg]>=2.37.2",
  "opencv-python>=4.11.0.86",
  "pot>=0.9.7",
  "pufferlib>=3.0.0",
  "scanpy>=1.11.5",
  "scikit-learn>=1.7.2",
  "seaborn>=0.13.2",
  "session-info2",
  "torch>=2.9.1",
  "wandb>=0.24.0",
]
[project.optional-dependencies]
dev = [
  "pre-commit",
  "ruff",
]
test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",     # For VS Code’s coverage functionality
]
[project.scripts]
train = "magna.cli.train:main"
sweep = "magna.cli.sweep:main"
puffer-sweep = "magna.cli.puffer_sweep:puffer_sweep"
debug = "magna.cli.debug:main"
build = "magna.cli.build:main"
eval = "magna.cli.eval:main"
experiment = "experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = [ "src/magna", "experiments" ]

[tool.ruff]
line-length = 88
src = [ "src", "experiments" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D101", # Missing docstring in public class
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D205", # 1 blank line required between summary line and description
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E402", # module level import not at top of cell
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]

[tool.coverage.run]
source = [ "magna" ]
patch = [ "subprocess" ]
omit = [
  "**/test_*.py",
]

[tool.uv]
exclude-newer = "2026-10-01T00:00:00Z"

[tool.uv.sources]
# pufferlib 3.0.0 with box2d pinned; upstream fetches the latest box2d, which no longer compiles
pufferlib = { git = "https://github.com/dschaub95/PufferLib.git", rev = "b45f2a9893d803a898a479b0b9daf4578d03049f" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
